name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config fuse3 libfuse3-dev libcurl4-openssl-dev
      - name: Build
        run: make
      - name: Smoke test
        run: |
          test -x curlhttpfs
          ./curlhttpfs -o url=https://example.com/test.bin --help >/dev/null
      - name: Clean rebuild
        run: |
          make clean
          make
      - name: Check FUSE device
        run: |
          ls -l /dev/fuse
          test -c /dev/fuse
      - name: HTTP Range + mounted filesystem tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Benchmark prefetch workers (loopback, informational)
        run: |
          python3 tests/benchmark_workers.py --size-mib 1 --latency-ms 15 --runs 1 --output benchmark-workers.json
      - name: Upload benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-workers-${{ matrix.os }}
          path: benchmark-workers.json
